[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = ["github"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# The archive format to use for non-windows builds
unix-archive = ".tar.gz"
# Archives only; each holds both binaries (sus and susd)
installers = []
# Plan only on pull requests; build and publish on a version tag
pr-run-mode = "plan"
