name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        # rust-toolchain.toml pins the version and components; this installs them.
        run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Audit dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit
